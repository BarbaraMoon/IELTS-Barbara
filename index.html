  _bindDrag(root){
    root.querySelectorAll("[data-drag-handle]").forEach(h=>{
      const card=h.closest(".topic-card");
      h.addEventListener("mousedown",e=>{ e.stopPropagation(); card.setAttribute("draggable","true"); });
      h.addEventListener("mouseup",()=>card.removeAttribute("draggable"));
      h.addEventListener("click",e=>e.stopPropagation());
    });
    root.querySelectorAll("[data-drag-card]").forEach(card=>{
      card.addEventListener("dragstart",e=>this._dragStart(e,card));
      card.addEventListener("dragover",e=>this._dragOver(e,card));
      card.addEventListener("dragleave",e=>this._dragLeave(e,card));
      card.addEventListener("drop",e=>this._drop(e,card,root));
      card.addEventListener("dragend",e=>this._dragEnd(e,card,root));
    });
  },
  _dragStart(e,card){ this._dragId=card.dataset.dragCard; this._dragPart=card.dataset.dragPart; card.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",this._dragId);}catch(_){} },
  _dragOver(e,card){ if(card.dataset.dragPart!==this._dragPart||!this._dragId) return; e.preventDefault(); const r=card.getBoundingClientRect(); const before=(e.clientY-r.top)<r.height/2; card.classList.toggle("drop-before",before); card.classList.toggle("drop-after",!before); e.dataTransfer.dropEffect="move"; },
  _dragLeave(e,card){ card.classList.remove("drop-before","drop-after"); },
  _drop(e,card,root){
    e.preventDefault(); card.classList.remove("drop-before","drop-after");
    if(!this._dragId||card.dataset.dragPart!==this._dragPart) return;
    const r=card.getBoundingClientRect(); const before=(e.clientY-r.top)<r.height/2;
    const part=this._dragPart;
    const arr=part==="p1"?Store.data.speaking.part1.topics:Store.data.speaking.part23.topics;
    const fromIdx=arr.findIndex(t=>t.id===this._dragId);
    let toIdx=arr.findIndex(t=>t.id===card.dataset.dragCard);
    if(fromIdx<0||toIdx<0||fromIdx===toIdx) return;
    const [moved]=arr.splice(fromIdx,1);
    if(fromIdx<toIdx) toIdx--;
    if(!before) toIdx++;
    arr.splice(toIdx,0,moved);
    Store.save();
    this._dragId=null; this._dragPart=null;
    this._rerender(root);
  },
  _dragEnd(e,card,root){
    card.classList.remove("dragging"); card.removeAttribute("draggable");
    root.querySelectorAll(".topic-card").forEach(c=>c.classList.remove("drop-before","drop-after"));
    this._dragId=null; this._dragPart=null;
  },
  _initScrollSpy(root){
    if(this._scrollSpy){ this._scrollSpy.disconnect(); this._scrollSpy=null; }
    const cards=root.querySelectorAll("[data-drag-card]");
    if(!cards.length) return;
    this._scrollSpy=new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          const id=en.target.dataset.dragCard;
          root.querySelectorAll("[data-jump-topic]").forEach(n=>n.classList.toggle("active",n.dataset.jumpTopic===id));
        }
      });
    },{rootMargin:"-90px 0px -70% 0px",threshold:0});
    cards.forEach(c=>this._scrollSpy.observe(c));
  },
  _rerender(root){
    const layout=root.querySelector(".speak-layout");
    if(!layout){ Router.go("speaking",true); return; }
    const y=window.scrollY;
    const navScroll=root.querySelector("#speak-nav")?.scrollTop||0;
    layout.innerHTML=this._renderLayoutInner();
    if(this._scrollSpy){ this._scrollSpy.disconnect(); this._scrollSpy=null; }
    this._bindAll(root);
    this._initScrollSpy(root);
    window.scrollTo(0,y);
    const nav=root.querySelector("#speak-nav"); if(nav) nav.scrollTop=navScroll;
  },
  _toggleCollapseAll(root,btn){

    root.querySelectorAll("[data-collect-s]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); collectSentence(b.dataset.collectS,"","口语"); }));

  // 计算每个 topic-preivew 相对 topic-card 的位置，并进行边缘检测
  _positionTopicPreviews(root){
    const cards=root.querySelectorAll(".topic-card");
    cards.forEach(card=>{
      const head=card.querySelector(":scope > .topic-head");
      const pv=card.querySelector(":scope > .topic-preview");
      if(!head||!pv) return;
      const headBottom = head.offsetTop + head.offsetHeight;
      const headTop = head.offsetTop;
      pv.removeAttribute("data-edge");
      // 先临时显示以便测量（不影响布局），临时解除 max-height 限制避免测量偏差
      const saved=[pv.style.cssText];
      pv.style.setProperty("visibility","hidden","");
      pv.style.setProperty("opacity","1","");
      pv.style.setProperty("pointer-events","none","");
      pv.style.setProperty("transform","none","");
      pv.style.setProperty("max-height","none","");
      // 默认：贴 card 左侧，贴 head 下方
      pv.style.left = "0px";
      pv.style.right = "auto";
      pv.style.top = headBottom + "px";
      pv.style.bottom = "auto";
      const rectL=pv.getBoundingClientRect();
      const vw=window.innerWidth||1280, vh=window.innerHeight||800;
      const flipRight = (rectL.right) > vw - 16;
      const flipBottom = (rectL.bottom) > vh - 16;
      const edges=[];
      if(flipRight) edges.push("right");
      if(flipBottom) edges.push("bottom");
      if(edges.length) pv.setAttribute("data-edge", edges.join(" "));
      // 应用最终定位（显式写 auto，避免被样式表覆盖）
      if(flipBottom){
        // 放在 head 上方：bottom = （card 顶部到 head 顶部距离） - 2px（小间隙）
        pv.style.top = "auto";
        pv.style.bottom = (card.offsetHeight - headTop + 2) + "px";
        // 初始位置从下方(向上飘入)改为从上方(向下飘入) —— 翻转方向
        pv.style.setProperty("transform","translateY(4px)","");
      } else {
        pv.style.top = headBottom + "px";
        pv.style.bottom = "auto";
        pv.style.setProperty("transform","translateY(-4px)","");
      }
      if(flipRight){
        pv.style.left = "auto";
        pv.style.right = "0px";
      } else {
        pv.style.left = "0px";
        pv.style.right = "auto";
      }
      // 恢复：去掉内联的 visibility/opacity/pointer/maxHeight；保留 transform/定位
      pv.style.removeProperty("visibility");
      pv.style.removeProperty("opacity");
      pv.style.removeProperty("pointer-events");
      pv.style.removeProperty("max-height");
      if(pv.style.cssText===";") pv.style.cssText=""; // 清理
    });
  },
  async exportAudio(){
    await AudioStore.init();
    const ids=new Set();
    const walk=q=>{ if(q&&q.audioId) ids.add(q.audioId); };
    Store.data.speaking.part1.topics.forEach(t=>t.questions.forEach(walk));
    Store.data.speaking.part23.topics.forEach(t=>{ walk(t.part2); t.part3.forEach(walk); });
    const audio={};
    for(const id of ids){ try{ const b=await AudioStore.get(id); if(b) audio[id]=await blobToDataURL(b); }catch(_){} }
    if(!Object.keys(audio).length){ toast("当前没有可导出的口语音频","info"); return; }
    const payload={_type:"ielts-speaking-audio",version:1,exportedAt:new Date().toISOString(),audio};
    const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=`IELTS Speaking Audio_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
    toast(`口语音频已导出（${Object.keys(audio).length} 段）`,"success");
  },
  importAudio(){
    const inp=document.createElement("input");
    inp.type="file"; inp.accept="application/json,.json";
    inp.addEventListener("change",e=>this._doImportAudio(e));
    inp.click();
  },
  async _doImportAudio(e){
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async ()=>{
      try{
        const parsed=JSON.parse(reader.result);
        if(parsed._type!=="ielts-speaking-audio"||!parsed.audio){ toast("文件格式不正确：不是口语音频备份","error"); return; }
        await AudioStore.init();
        let n=0;
        for(const id in parsed.audio){ try{ await AudioStore.save(id,dataURLToBlob(parsed.audio[id])); n++; }catch(_){} }
        toast(`口语音频导入成功：${n} 段（若题目文本已存在即可播放）`,"success");
        Router.go("speaking");
      }catch(err){ toast("导入失败：文件格式错误","error"); }
    };
    reader.readAsText(file);
  },
  async _loadAudios(root){
    const allQs=[...Store.data.speaking.part1.topics.flatMap(t=>t.questions), ...Store.data.speaking.part23.topics.flatMap(t=>[{...t.part2,id:t.id,audioId:t.part2.audioId},...t.part3])];
    for(const q of allQs){ if(q.audioId){ try{ const blob=await AudioStore.get(q.audioId); if(blob){ const url=URL.createObjectURL(blob); const el=root.querySelector(`audio[data-audio="${q.audioId}"]`); if(el){ el.src=url; try{ el.load(); }catch(_){} } } }catch(e){} } }
  },
  // ---- P1 render ----
  _topicPreviewHTML(t,part){
    const lines=[];
    if(t.note) lines.push(`<div class="tp-note">${esc(t.note)}</div>`);
    let qs=[];
    if(part==="p1") qs=t.questions;
    else qs=[...(t.part2?.question?[{question:t.part2.question,_label:"Part 2"}]:[]), ...t.part3.map(q=>({question:q.question,_label:"Part3"}))];
    if(qs.length){
      lines.push(`<div class="tp-sep">${part==="p1"?"题目预览":"问题预览"}</div>`);
      qs.forEach((q,i)=>{
        const label=q._label?`<span class="tp-label">${q._label}</span>`:`<span class="tp-num">${i+1}.</span>`;
        lines.push(`<div class="tp-q">${label}<span class="tp-qt">${esc(q.question||"")}</span></div>`);
      });
    }
    if(!lines.length) return "";
    return `<div class="tp-title">${esc(t.name)}</div>${lines.join("")}`;
  },

  // ---- P1 topic edit ----
  _editTopicP1(id){
    const topics=Store.data.speaking.part1.topics; const t=id?topics.find(x=>x.id===id):null;

  _delTopicP23(id){ const ts=Store.data.speaking.part23.topics; const i=ts.findIndex(t=>t.id===id); if(i>=0){ const t=ts[i]; if(t.part2.audioId) AudioStore.delete(t.part2.audioId); t.part3.forEach(q=>{ if(q.audioId) AudioStore.delete(q.audioId); }); ts.splice(i,1); Store.save(); Router.go("speaking",true); } },
  // ---- Audio ----
  async _uploadAudio(key,e){
    const file=e.target.files[0]; if(!file) return; const [tid,qid]=key.split("_");
    const q=this._findQ(tid,qid); if(!q) return;
    const aid=Store.uid();
    try{ await AudioStore.save(aid,file); if(q.audioId) await AudioStore.delete(q.audioId); q.audioId=aid; Store.save(); toast("录音上传成功","success"); Router.go("speaking",true); }
    catch(err){ toast("录音保存失败","error"); }
  },
  async _delAudio(tid,qid){
    const q=this._findQ(tid,qid); if(!q||!q.audioId) return;
    await AudioStore.delete(q.audioId); q.audioId=""; Store.save(); Router.go("speaking",true);
  },
  _findQ(tid,qid){
    // search P1
    for(const t of Store.data.speaking.part1.topics){ const q=t.questions.find(x=>x.id===qid); if(q) return q; }
    // search P23
    for(const t of Store.data.speaking.part23.topics){
      if(t.id===qid) return t.part2; // p2 uses topic id as q id
      const q=t.part3.find(x=>x.id===qid); if(q) return q;
    }
    return null;
  },
  async _toggleRecord(tid,qid){
    const btn=document.querySelector(`[data-record="${tid}"][data-id="${qid}"]`);
    if(this._recording){ this._stopRecording(); if(btn) btn.textContent="🎤 录音"; return; }
    try{
      if(!this._recStream){
        this._recStream=await navigator.mediaDevices.getUserMedia({audio:true});
        // 页面关闭/离开时再统一释放麦克风，避免每次录音都要重新授权
        addEventListener("pagehide",()=>{ if(this._recStream) this._recStream.getTracks().forEach(t=>t.stop()); },{once:true});
      }
      // 用 Web Audio 直接捕获原始 PCM 并编码成 WAV：iOS Safari 无法播放 MediaRecorder 产出的 mp4，
      // 而 WAV 在所有平台（含 iOS）都能用 <audio> 正常播放，故统一走 WAV。
      const AC=window.AudioContext||window.webkitAudioContext;
      const ctx=new AC();
      if(ctx.state==="suspended") await ctx.resume();
      const sampleRate=ctx.sampleRate;
      const source=ctx.createMediaStreamSource(this._recStream);
      const processor=ctx.createScriptProcessor(4096,1,1);
      const chunks=[];
      processor.onaudioprocess=e=>{ chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
      const silent=ctx.createGain(); silent.gain.value=0;
      source.connect(processor); processor.connect(silent); silent.connect(ctx.destination);
      this._recording=true;
      this._stopRecording=()=>{
        try{ source.disconnect(); processor.disconnect(); silent.disconnect(); }catch(_){}
        if(this._recStream){ this._recStream.getTracks().forEach(t=>t.stop()); this._recStream=null; }
        this._recording=false; this._stopRecording=null;
        const blob=encodeWAV(chunks,sampleRate);
        this._saveRecording(blob,tid,qid);
        try{ ctx.close(); }catch(_){}
      };
      if(btn) btn.innerHTML='<span class="recording-indicator"><span class="recording-dot"></span>停止</span>';
    }catch(e){
      console.error(e);
      const msg=(e&&e.name==="NotAllowedError")?"无法访问麦克风，请在浏览器中允许麦克风权限":"录音初始化失败（"+(e&&e.name||"")+"），当前浏览器可能不支持录音";
      toast(msg,"error");
    }
  },
  _saveRecording(blob,tid,qid){
    const q=this._findQ(tid,qid); const aid=Store.uid();
    AudioStore.save(aid,blob).then(()=>{
      if(q.audioId) AudioStore.delete(q.audioId);
      q.audioId=aid; Store.save(); toast("录音完成","success"); Router.go("speaking",true);
    }).catch(()=>toast("录音保存失败","error"));
  },
  unmount(){
    if(this._scrollSpy){ this._scrollSpy.disconnect(); this._scrollSpy=null; }
    if(this._onResize){ window.removeEventListener("resize",this._onResize); this._onResize=null; }
  }
};

      const list=type==="word"?Store.data.vocabulary.words:Store.data.vocabulary.sentences;
      const item=list.find(x=>x.id===rid);
      if(item){ if(field==="note"){item.note=value;} else if(field==="translation"){item.translation=value;} else if(field==="word"){item.word=value;} else if(field==="sentence"){item.sentence=value;} Store.save(); }
      self._autoHeight(ta);
    };
    this._keydownHandler=function(e){
      const ta=e.target;
      if(!ta.classList||!ta.classList.contains("cell-editor")) return;
      if(e.key==="Enter"&&!e.shiftKey){
        e.preventDefault(); ta.blur();
        const pool=Array.from(root.querySelectorAll(ta.dataset.type==="word"?"[data-type='word'].cell-editor":"[data-type='sent'].cell-editor"));
        const idx=pool.indexOf(ta);
        if(idx>=0&&idx<pool.length-1){ const nx=pool[idx+1]; nx.focus(); self._autoHeight(nx); }
        return;
      }
    };
    this._clickHandler=function(e){
      const speak=e.target.closest("[data-w-speak],[data-s-speak]");
      if(speak){
        if(speak.dataset.wSpeak){ const item=Store.data.vocabulary.words.find(w=>w.id===speak.dataset.wSpeak); if(item) Translator.pronounce(item.word,{audioUrl:item.audioUrl}); }
        else { const item=Store.data.vocabulary.sentences.find(s=>s.id===speak.dataset.sSpeak); if(item) Translator.pronounce(item.sentence); }
        return;
      }
      const insW=e.target.closest('[data-act="insert-w"]'); if(insW){ self._insertAfter("word",insW.dataset.insertAfter); return; }
      const insS=e.target.closest('[data-act="insert-s"]'); if(insS){ self._insertAfter("sent",insS.dataset.insertAfter); return; }
      const saveW=e.target.closest('[data-act="save-new-w"]'); if(saveW){ self._saveNew("word"); return; }
      const saveS=e.target.closest('[data-act="save-new-s"]'); if(saveS){ self._saveNew("sent"); return; }
    };
    this._dblclickHandler=function(e){
      const d=e.target.closest("[data-w-del]"); if(d){ self._del("word",d.dataset.wDel); return; }
      const d2=e.target.closest("[data-s-del]"); if(d2){ self._del("sent",d2.dataset.sDel); return; }
    };
    root.addEventListener("blur",this._blurHandler,true);
    root.addEventListener("keydown",this._keydownHandler,true);
    root.addEventListener("click",this._clickHandler);
    root.addEventListener("dblclick",this._dblclickHandler);
    this._initHeights(root,'#words-list');
    this._initHeights(root,'#sentences-list');
  },
  unmount(){
    const root=this._root; if(!root) return;
    if(this._blurHandler) root.removeEventListener("blur",this._blurHandler,true);
    if(this._keydownHandler) root.removeEventListener("keydown",this._keydownHandler,true);
    if(this._clickHandler) root.removeEventListener("click",this._clickHandler);
    if(this._dblclickHandler) root.removeEventListener("dblclick",this._dblclickHandler);
    this._root=null;
  },
  _initHeights(root,sel){ const c=root.querySelector(sel); if(!c) return; c.querySelectorAll(".cell-editor").forEach(el=>this._autoHeight(el)); },
  _autoHeight(el){ el.style.height='auto'; el.style.height=Math.max(24,el.scrollHeight)+'px'; },
  _getProto(t){ const k=t==="word"?"__protoVW":"__protoVS"; return window[k]=window[k]||(t==="word"?{word:"",translation:"",note:""}:{sentence:"",translation:"",note:""}); },
  _clearProto(t){ if(t==="word") window.__protoVW=null; else window.__protoVS=null; },
  _rerender(panelSel,preserveId,preserveField){
    const root=this._root; if(!root) return;
    const sy=window.scrollY; const c=root.querySelector(panelSel); if(!c) return;
    if(panelSel==="#words-list") c.innerHTML=this._renderWords(Store.data.vocabulary.words);
    else c.innerHTML=this._renderSentences(Store.data.vocabulary.sentences);
    window.scrollTo(0,sy);
    c.querySelectorAll(".cell-editor").forEach(el=>this._autoHeight(el));
    if(preserveId){ const row=c.querySelector(`[data-vrow="${preserveId}"]`); if(row&&preserveField){ const el=row.querySelector(`[data-field="${preserveField}"]`); if(el){ el.focus(); this._autoHeight(el); } } }
  },
  _insertAfter(type,afterId){
    const list=type==="word"?Store.data.vocabulary.words:Store.data.vocabulary.sentences;
    const ns=type==="word"?{id:Store.uid(),word:"",translation:"",phonetic:"",note:"",source:"",audioUrl:"",createdAt:Date.now()}:{id:Store.uid(),sentence:"",translation:"",note:"",source:"",createdAt:Date.now()};
    if(afterId){ const idx=list.findIndex(x=>x.id===afterId); if(idx>=0) list.splice(idx+1,0,ns); else list.push(ns); }
    else list.push(ns);
    Store.save();
    this._rerender(type==="word"?"#words-list":"#sentences-list",ns.id,type==="word"?"word":"sentence");
  },
  _saveNew(type){
    const p=this._getProto(type);
    const strip=s=>(s||"").replace(/<[^>]+>/g,"").trim();
    const main=strip(type==="word"?p.word:p.sentence);
    if(!main){ toast("请填写内容","error"); return; }
    const list=type==="word"?Store.data.vocabulary.words:Store.data.vocabulary.sentences;
    const ns=type==="word"?{id:Store.uid(),word:p.word,translation:p.translation||"",phonetic:"",note:p.note||"",source:"手动添加",audioUrl:"",createdAt:Date.now()}:{id:Store.uid(),sentence:p.sentence,translation:p.translation||"",note:p.note||"",source:"手动添加",createdAt:Date.now()};
    list.push(ns); Store.save(); this._clearProto(type);
    toast("已添加","success");
    this._rerender(type==="word"?"#words-list":"#sentences-list");
  },
  _del(type,id){
    if(id==="NEW"){ this._clearProto(type); this._rerender(type==="word"?"#words-list":"#sentences-list"); return; }
    const list=type==="word"?Store.data.vocabulary.words:Store.data.vocabulary.sentences;
    const i=list.findIndex(x=>x.id===id); if(i>=0){ list.splice(i,1); Store.save(); this._rerender(type==="word"?"#words-list":"#sentences-list"); }
  },
  _renderWords(list,search){
    let items=list; if(search){ const s=search.toLowerCase(); items=list.filter(w=>w.word.toLowerCase().includes(s)||(w.translation||"").includes(s)); }
    const rc=s=>{ if(!s) return ""; const str=String(s); return /<[a-z][^>]*>/i.test(str)&&/&lt;|&gt;|&amp;/.test(str)===false ? str : esc(str).replace(/\n/g,"<br>"); };
    const renderRow=(w,isNew)=>{
      const rid=isNew?"NEW":w.id;
      return `<tr data-vrow="${rid}"${isNew?' class="is-new"':''}>
        <td class="cell-word"><div class="cell-editor" contenteditable="true" data-type="word" data-rid="${rid}" data-field="word">${rc(w.word)}</div>${w.phonetic&&!isNew?` <span class="vocab-phonetic">/${esc(w.phonetic)}/</span>`:""}</td>
        <td class="cell-trans"><div class="cell-editor" contenteditable="true" data-type="word" data-rid="${rid}" data-field="translation">${rc(w.translation||"")}</div></td>
        <td class="cell-trans"><div class="cell-editor" contenteditable="true" data-type="word" data-rid="${rid}" data-field="note">${rc(w.note||"")}</div></td>
        <td class="cell-source">${isNew?"":(w.source?`<span class="tag-sm">${esc(w.source)}</span>`:"")+" "+fmtDate(w.createdAt)}</td>
        <td class="cell-actions">
          ${isNew?'<button class="btn-icon" title="保存新行" data-act="save-new-w">💾</button>':`<button class="btn-icon" title="在下方插入一行" data-act="insert-w" data-insert-after="${w.id}">➕</button>`}
          <button class="btn-icon" data-w-speak="${rid}" title="发音">🔊</button>
          <button class="btn-icon" data-w-del="${rid}" title="双击删除">🗑️</button>
        </td>
      </tr>`;
    };
    if(!items.length) return `<table class="data-table"><thead><tr><th>词汇</th><th>释义</th><th>备注</th><th>来源</th><th style="text-align:right">操作</th></tr></thead><tbody>${renderRow(this._getProto("word"),true)}</tbody></table>`;
    return `<table class="data-table"><thead><tr><th>词汇</th><th>释义</th><th>备注</th><th>来源</th><th style="text-align:right">操作</th></tr></thead><tbody>`+
      items.slice().reverse().map(w=>renderRow(w,false)).join("")+renderRow(this._getProto("word"),true)+`</tbody></table>`;
  },
  _renderSentences(list,search){
    let items=list; if(search){ const s=search.toLowerCase(); items=list.filter(x=>x.sentence.toLowerCase().includes(s)||(x.translation||"").includes(s)); }
    const rc=s=>{ if(!s) return ""; const str=String(s); return /<[a-z][^>]*>/i.test(str)&&/&lt;|&gt;|&amp;/.test(str)===false ? str : esc(str).replace(/\n/g,"<br>"); };
    const renderRow=(s,isNew)=>{
      const rid=isNew?"NEW":s.id;
      return `<tr data-vrow="${rid}"${isNew?' class="is-new"':''}>
        <td class="cell-sentence" style="min-width:320px"><div class="cell-editor" contenteditable="true" data-type="sent" data-rid="${rid}" data-field="sentence">${rc(s.sentence)}</div></td>
        <td class="cell-trans"><div class="cell-editor" contenteditable="true" data-type="sent" data-rid="${rid}" data-field="translation">${rc(s.translation||"")}</div></td>
        <td class="cell-trans"><div class="cell-editor" contenteditable="true" data-type="sent" data-rid="${rid}" data-field="note">${rc(s.note||"")}</div></td>
        <td class="cell-source">${isNew?"":(s.source?`<span class="tag-sm">${esc(s.source)}</span>`:"")+" "+fmtDate(s.createdAt)}</td>
        <td class="cell-actions">
          ${isNew?'<button class="btn-icon" title="保存新行" data-act="save-new-s">💾</button>':`<button class="btn-icon" title="在下方插入一行" data-act="insert-s" data-insert-after="${s.id}">➕</button>`}
          <button class="btn-icon" data-s-speak="${rid}" title="朗读">🔊</button>
          <button class="btn-icon" data-s-del="${rid}" title="双击删除">🗑️</button>
        </td>
      </tr>`;
    };
    if(!items.length) return `<table class="data-table"><thead><tr><th style="min-width:320px">句子/短语</th><th>释义</th><th>备注</th><th>来源</th><th style="text-align:right">操作</th></tr></thead><tbody>${renderRow(this._getProto("sent"),true)}</tbody></table>`;
    return `<table class="data-table"><thead><tr><th style="min-width:320px">句子/短语</th><th>释义</th><th>备注</th><th>来源</th><th style="text-align:right">操作</th></tr></thead><tbody>`+
      items.slice().reverse().map(s=>renderRow(s,false)).join("")+renderRow(this._getProto("sent"),true)+`</tbody></table>`;
  }
};

/* ============================================================ FLOAT TRANSLATE */
const FloatTranslate={
  expanded:false,
  init(){
    const c=document.getElementById("float-translate");
    c.innerHTML=`<button class="ft-toggle" id="ft-toggle" title="快速翻译">译</button>
      <div class="ft-panel hidden" id="ft-panel"><div class="ft-panel-head"><span>快速翻译</span><button class="modal-close" id="ft-close">&times;</button></div>
      <div class="ft-panel-body"><textarea id="ft-input" placeholder="输入要翻译的英文或中文…"></textarea>
      <div class="ft-result" id="ft-result">翻译结果将显示在这里</div>
      <div class="ft-actions"><button class="btn btn-primary btn-sm" id="ft-go">翻译</button><button class="btn btn-outline btn-sm" id="ft-speak">🔊 朗读</button><button class="btn btn-outline btn-sm" id="ft-collect">⭐ 收藏</button></div></div></div>`;
    document.getElementById("ft-toggle").addEventListener("click",()=>this.toggle());
    document.getElementById("ft-close").addEventListener("click",()=>this.toggle(false));
    document.getElementById("ft-go").addEventListener("click",()=>this.translate());
    document.getElementById("ft-speak").addEventListener("click",()=>{ const t=document.getElementById("ft-input").value.trim(); if(t) Translator.pronounce(t); });
    document.getElementById("ft-collect").addEventListener("click",()=>this.collect());
    document.getElementById("ft-input").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); this.translate(); } });
  },
  toggle(force){ this.expanded=force!==undefined?force:!this.expanded; document.getElementById("ft-panel").classList.toggle("hidden",!this.expanded); if(this.expanded) document.getElementById("ft-input").focus(); },
  async translate(){
    const text=document.getElementById("ft-input").value.trim(); if(!text) return;
    const res=document.getElementById("ft-result"); res.textContent="翻译中…";
    const r=await Translator.lookup(text);
    if(r&&r.translation){ res.textContent=r.translation; this._lastResult=r; } else res.textContent="翻译失败，请检查网络连接";
  },
  collect(){
    if(!this._lastResult){ toast("请先翻译","info"); return; } const r=this._lastResult;
    if(r.isWord) collectWord(r.word||r.text,r.translation,r.phonetic,"翻译工具"); else collectSentence(r.text,r.translation,"翻译工具");
  }
};

/* ============================================================ REGISTRY & INIT */
const MODULES={dashboard:Dashboard,listening:Listening,reading:Reading,speaking:Speaking,writing:Writing,vocabulary:Vocabulary};
document.addEventListener("DOMContentLoaded",async()=>{
  Store.load(); await AudioStore.init();
  const nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(n=>`<button class="nav-item" data-route="${n.key}">${n.label}</button>`).join("");
  nav.querySelectorAll(".nav-item").forEach(el=>el.addEventListener("click",()=>Router.go(el.dataset.route)));
  SelectionPopup.init(); FloatTranslate.init();
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ hideModal(); SelectionPopup.hide(); FloatTranslate.toggle(false); } });
  // 回到顶部浮窗
  const btt=document.getElementById("back-to-top");
  btt.addEventListener("click",()=>window.scrollTo(0,0));
  window.addEventListener("scroll",()=>{ btt.classList.toggle("show",window.scrollY>400); },{passive:true});
  const last=localStorage.getItem("__lastRoute");
  Router.go(last&&MODULES[last]?last:"dashboard");
});
</script>
