<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS｜Barbara</title>
<style>
:root{
  --bg:#faf9f7;
  --bg-grad:none;
  --surface:#ffffff;
  --surface-2:#faf9f7;
  --surface-hover:#f0eee9;
  --text:#141414;
  --text-2:#73716c;
  --text-3:#8f8c86;
  --border:#e6e3dd;
  --border-2:#d9d5ce;
  --primary:#141414;
  --primary-hover:#000000;
  --primary-light:#eceae6;
  --primary-grad:#141414;
  --emerald:#3d7a52;
  --emerald-light:#e4ede6;
  --amber:#8a6d2f;
  --amber-light:#f0e9da;
  --rose:#a8433c;
  --rose-light:#f2e3e1;
  --violet:#6b5b7a;
  --violet-light:#eae5ee;
  --teal:#4a7a72;
  --teal-light:#e2ebe9;
  --sky:#4a6a8a;
  --sky-light:#e3eaf1;
  --orange:#8a5a2f;
  --orange-light:#f0e6da;
  --shadow-sm:none;
  --shadow:none;
  --shadow-md:none;
  --shadow-lg:0 16px 48px rgba(20,20,20,.12),0 4px 12px rgba(20,20,20,.06);
  --radius:4px;
  --radius-sm:4px;
  --radius-xs:3px;
  --max-w:1000px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);background-image:var(--bg-grad);background-repeat:no-repeat;
  color:var(--text);line-height:1.7;font-size:15px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-weight:700;line-height:1.35;letter-spacing:-.01em;color:var(--text)}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-hover)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
textarea{resize:vertical;line-height:1.75}
.hidden{display:none!important}

/* Layout */
#app{min-height:100vh;display:flex;flex-direction:column}
header.app-header{
  background:rgba(250,249,247,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;
}
.header-inner{max-width:var(--max-w);margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:28px;height:68px}
.logo-area{display:flex;align-items:center;gap:11px;flex-shrink:0}
.logo-svg{width:34px;height:24px;flex-shrink:0}
.logo-svg path{stroke:#141414}
.logo-svg path:nth-child(1){opacity:.9}
.logo-svg path:nth-child(2){opacity:.75}
.logo-svg path:nth-child(3){opacity:.6}
.logo-svg path:nth-child(4){opacity:.45}
.logo-svg path:nth-child(5){opacity:.3}
.logo-svg path:nth-child(6){opacity:.16}
.logo-text{font-size:17px;font-weight:700;letter-spacing:.02em;white-space:nowrap;color:#141414}
nav.app-nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
nav.app-nav::-webkit-scrollbar{display:none}
.nav-item{padding:8px 14px;border-radius:var(--radius-xs);font-size:14px;color:var(--text-2);white-space:nowrap;transition:.2s;font-weight:500}
.nav-item:hover{background:transparent;color:var(--text)}
.nav-item.active{background:transparent;color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--text)}
main#content{flex:1;max-width:var(--max-w);width:100%;margin:0 auto;padding:36px 28px 100px}

/* Components */
.page-title{font-size:30px;font-weight:600;color:var(--text);letter-spacing:-.02em;margin-bottom:28px}
.page-desc{color:var(--text-2);font-size:14px;margin-bottom:28px}
.section-title{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.14em;margin-bottom:14px;display:flex;align-items:center;gap:8px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:none;transition:border-color .2s ease}
.card:hover{box-shadow:none;border-color:var(--border)}
.card+.card{margin-top:16px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:.2s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff;box-shadow:none}
.btn-primary:hover{background:var(--primary-hover);box-shadow:none;transform:none}
.btn-outline{border-color:var(--border-2);color:var(--text);background:var(--surface)}
.btn-outline:hover{border-color:var(--text);color:var(--text);background:var(--surface)}
.btn-ghost{color:var(--text-2);background:transparent}
.btn-ghost:hover{background:var(--surface-hover);color:var(--text)}
.btn-danger{background:var(--rose);color:#fff}
.btn-danger:hover{background:#8f352f}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:var(--radius-xs)}
.btn-icon{padding:6px 8px;font-size:15px;border-radius:var(--radius-xs);line-height:1;color:var(--text-2)}
.btn-icon:hover{background:var(--surface-hover);color:var(--text)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px}
.tab{padding:11px 20px;font-size:14px;font-weight:600;color:var(--text-3);border-bottom:1px solid transparent;margin-bottom:-1px;transition:.2s;border-radius:var(--radius-xs) var(--radius-xs) 0 0}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--text);border-bottom-color:var(--text)}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:10px 14px;border:1.5px solid var(--border-2);border-radius:var(--radius-sm);background:var(--surface-2);transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-light)}
.field select{cursor:pointer}

/* Entry cards */
.entry{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);transition:.25s;position:relative}
.entry+.entry{margin-top:14px}
.entry:hover{box-shadow:var(--shadow);border-color:var(--border-2)}
.entry-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.entry-title{font-weight:700;font-size:15px;flex:1;line-height:1.5}
.entry-meta{font-size:12px;color:var(--text-3);white-space:nowrap}
.entry-body{font-size:14px;color:var(--text-2);line-height:1.75;white-space:pre-wrap;word-break:break-word}
.entry-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.empty-state{text-align:center;padding:56px 20px;color:var(--text-3)}
.empty-state-icon{font-size:44px;margin-bottom:14px;opacity:.4}
.empty-state-text{font-size:14px}

/* Note tooltip */
.note-tip{position:relative;cursor:help;border-bottom:2px dotted var(--primary);display:inline-block}
.note-tip::after{content:attr(data-note);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#141414;color:#fff;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;line-height:1.6;white-space:pre-wrap;max-width:300px;min-width:140px;z-index:9999;opacity:0;pointer-events:none;transition:.18s;box-shadow:var(--shadow-lg)}
.note-tip:hover::after{opacity:1}
.note-tip::before{content:"";position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#141414;z-index:9999;opacity:0;transition:.18s}
.note-tip:hover::before{opacity:1}

/* Tags & badges */
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:3px;font-weight:600;vertical-align:middle;letter-spacing:.02em}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 12px;border-radius:3px;font-weight:600}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:48px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 22px 20px;text-align:left;box-shadow:none;cursor:pointer;transition:border-color .2s ease;position:relative;overflow:hidden}
.stat-card::before{display:none}
.stat-card:hover{box-shadow:none;transform:none;border-color:var(--text)}
.stat-num{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:400;color:var(--text);line-height:1;font-variant-numeric:tabular-nums}
.stat-label{font-size:13px;color:var(--text-2);margin-top:10px;font-weight:500;letter-spacing:.02em}

/* Quick links */
.quick-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.quick-link{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;transition:border-color .2s ease;box-shadow:none;cursor:pointer}
.quick-link:hover{box-shadow:none;transform:none;border-color:var(--text)}
.quick-link::after{content:"→";color:var(--text-3);font-size:15px;transition:color .2s ease,transform .2s ease}
.quick-link:hover::after{color:var(--text);transform:translateX(3px)}
.quick-link-icon{font-size:24px}
.quick-link-title{font-weight:600;font-size:16px;color:var(--text)}
.quick-link-desc{font-size:12px;color:var(--text-3)}

/* Error type chips */
.err-type-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.err-chip{padding:6px 14px;border-radius:3px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;border:1px solid var(--border-2);background:var(--surface);color:var(--text-2)}
.err-chip:hover{border-color:var(--text)}
.err-chip.active{color:#fff;border-color:transparent}
.err-type-badge{font-size:11px;padding:3px 10px;border-radius:3px;font-weight:700;letter-spacing:.02em}

/* Synonym pair */
.syn-pair{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.syn-word{font-weight:700;font-size:15px}
.syn-arrow{color:var(--primary);font-size:16px;font-weight:700}

/* Selection popup */
#translate-popup{position:fixed;z-index:10000;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:0;min-width:280px;max-width:360px;font-size:14px;overflow:hidden}
.popup-loading{padding:18px;text-align:center;color:var(--text-3)}
.popup-header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.popup-word{font-weight:800;font-size:17px;color:var(--text)}
.popup-phonetic{color:var(--primary);font-size:13px;font-style:italic;font-weight:600}
.popup-body{padding:12px 16px}
.popup-trans{color:var(--text);line-height:1.65;font-weight:500}
.popup-def{color:var(--text-2);font-size:13px;margin-top:6px;line-height:1.55}
.popup-footer{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.popup-footer .btn{flex:1;justify-content:center}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,.35);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:540px;max-height:86vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-size:18px;font-weight:700}
.modal-close{font-size:24px;color:var(--text-3);line-height:1;padding:4px;border-radius:var(--radius-xs)}
.modal-close:hover{color:var(--text);background:var(--surface-hover)}
.modal-body{padding:24px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:18px 24px;border-top:1px solid var(--border)}

/* Toast */
#toast-container{position:fixed;top:80px;right:28px;z-index:10001;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 18px;box-shadow:var(--shadow-md);font-size:14px;animation:slideIn .3s ease;border-left:4px solid var(--primary);min-width:220px;font-weight:500}
.toast.success{border-left-color:var(--emerald)}
.toast.error{border-left-color:var(--rose)}
.toast.info{border-left-color:var(--sky)}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}

/* Floating translate */
#float-translate{position:fixed;bottom:28px;right:28px;z-index:500}
.ft-toggle{width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;box-shadow:var(--shadow-lg);transition:.25s}
.ft-toggle:hover{transform:scale(1.08);box-shadow:var(--shadow-lg)}
#back-to-top{position:fixed;bottom:28px;left:28px;z-index:500;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:none;cursor:pointer;transition:.25s;opacity:0;pointer-events:none;transform:translateY(10px)}
#back-to-top.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#back-to-top:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:none}
.ft-panel{position:absolute;bottom:64px;right:0;width:350px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden}
.ft-panel-head{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.ft-panel-body{padding:16px 18px}
.ft-panel-body textarea{width:100%;border:1.5px solid var(--border-2);border-radius:var(--radius-sm);padding:10px 14px;min-height:72px;margin-bottom:10px;background:var(--surface-2);transition:.2s}
.ft-panel-body textarea:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-light)}
.ft-result{min-height:54px;padding:12px 14px;background:var(--surface-2);border-radius:var(--radius-sm);font-size:14px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word}
.ft-actions{display:flex;gap:8px;margin-top:10px}

/* Speaking */
.speak-answer{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.85;color:var(--text);padding:14px 16px;background:var(--surface-2);border-radius:var(--radius-sm);border-left:3px solid var(--primary)}
.audio-player{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;background:var(--surface-2);border-radius:var(--radius-sm)}
.audio-player audio{flex:1;height:38px}
.recording-indicator{display:inline-flex;align-items:center;gap:6px;color:var(--rose);font-size:13px;font-weight:600}
.recording-dot{width:8px;height:8px;border-radius:50%;background:var(--rose);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Topic card */
.topic-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:visible;transition:.25s;position:relative;z-index:1}
.topic-card+.topic-card{margin-top:16px}
.topic-card:hover{box-shadow:var(--shadow)}
/* 当 head 或 预览被 hover 时，提升整张卡的层级（不管卡是展开还是折叠），确保预览浮在所有卡/导航之上 */
.topic-card:has(> .topic-head:hover),
.topic-card:has(> .topic-preview:hover){z-index:200}
.topic-head{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;user-select:none}
.topic-head:hover{background:var(--surface-hover)}
.topic-chevron{font-size:14px;color:var(--text-3);transition:.25s;flex-shrink:0}
.topic-chevron.open{transform:rotate(90deg)}
.topic-name{font-weight:700;font-size:16px;flex:1}
.topic-count{font-size:12px;color:var(--text-3);font-weight:500}
.topic-body{padding:0 20px 20px;border-top:1px solid var(--border)}
.topic-actions{display:flex;gap:6px;flex-shrink:0}
.part-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:3px;margin-bottom:10px}
.part2-label{background:var(--text);color:#fff}
.part3-label{background:transparent;color:var(--text);border:1px solid var(--border-2)}

/* Speaking layout */
.speak-layout{display:flex;gap:22px;align-items:flex-start}
.speak-nav{flex-shrink:0;width:208px;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow-sm)}
.speak-nav-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px 8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.speak-nav-item{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:var(--radius-xs);font-size:13px;color:var(--text-2);cursor:pointer;border:none;background:none;transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.speak-nav-item:hover{background:var(--surface-hover);color:var(--primary)}
.speak-nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.speak-main{flex:1;min-width:0}
.speak-filters{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.filter-group{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filter-group:last-child{margin-bottom:0}
.filter-label{font-size:12px;font-weight:700;color:var(--text-3);margin-right:4px;min-width:34px}
.filter-chip{padding:4px 12px;border-radius:3px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);transition:.18s}
.filter-chip:hover{border-color:var(--text);color:var(--text)}
.filter-chip.active{background:var(--text);color:#fff;border-color:transparent}
.filter-clear{font-size:11px;color:var(--text-3);cursor:pointer;margin-left:6px;text-decoration:underline}
.filter-clear:hover{color:var(--rose)}
.topic-tags{display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0}
.topic-tag-badge{font-size:11px;padding:2px 9px;border-radius:3px;font-weight:600}
.topic-tag-badge.g-type{background:var(--text);color:#fff}
.topic-tag-badge.g-cat{background:transparent;color:var(--text-2);border:1px solid var(--border-2)}
.topic-drag{cursor:grab;color:var(--text-3);font-size:16px;padding:2px 4px;flex-shrink:0;line-height:1}
.topic-drag:active{cursor:grabbing}
.topic-drag:hover{color:var(--text)}
.topic-card{scroll-margin-top:88px}
.topic-card.dragging{opacity:.4}
.topic-card.drop-before{box-shadow:0 -3px 0 0 var(--text) inset;background:var(--surface-hover)}
.topic-card.drop-after{box-shadow:0 3px 0 0 var(--text) inset;background:var(--surface-hover)}
.topic-card.flash{animation:flashFrame .4s ease-out}
@keyframes flashFrame{0%{box-shadow:0 0 0 1.5px var(--text);background:var(--surface-hover)}60%{box-shadow:0 0 0 1.5px var(--text);background:var(--surface-hover)}100%{box-shadow:0 0 0 1.5px rgba(20,20,20,0);background:transparent}}
/* Topic hover preview: absolute-floated above topic-card, does NOT push topic-body */
.topic-head{position:relative;z-index:2}
.topic-preview{
  position:absolute;z-index:50;
  min-width:420px;max-width:560px;max-height:56vh;overflow:auto;
  padding:14px 16px;background:var(--surface);
  border:1px solid var(--border-2);border-radius:10px;
  box-shadow:0 20px 40px -16px rgba(20,20,20,.22),0 4px 12px -6px rgba(20,20,20,.12);
  line-height:1.6;opacity:0;visibility:hidden;transform:translateY(-4px);
  transition:opacity .16s ease,transform .16s ease,visibility 0s linear .16s;
  pointer-events:none;
}
.topic-card:has(> .topic-head:hover) > .topic-preview,
.topic-preview:hover{
  opacity:1;visibility:visible;transform:translateY(0);
  transition-delay:0s;pointer-events:auto;
}
/* Arrow pointing up to the topic-head (left side, ~22px from left aligns with drag handle) */
.topic-preview:before{content:"";position:absolute;top:-6px;left:22px;border:6px solid transparent;border-top-color:transparent;border-bottom-color:var(--surface);filter:drop-shadow(0 -1px 0 var(--border-2))}
/* Edge override attributes: JS will set these based on viewport collision */
.topic-preview[data-edge~="right"]{left:auto;right:0}
.topic-preview[data-edge~="right"]:before{left:auto;right:22px}
.topic-preview[data-edge~="bottom"]:before{top:auto;bottom:-6px;transform:rotate(180deg)}
.tp-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px}
.tp-note{font-size:13px;color:var(--text-2);padding:8px 10px;background:var(--surface-2);border-radius:6px;border-left:2px solid var(--text);white-space:pre-wrap;word-break:break-word}
.tp-sep{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 4px}
.tp-q{display:flex;gap:6px;font-size:12.5px;color:var(--text-2);padding:3px 0}
.tp-q .tp-num,.tp-q .tp-label{flex-shrink:0;font-weight:700;color:var(--text-3)}
.tp-q .tp-label{color:var(--text);font-size:11px;padding:1px 6px;background:var(--surface-2);border-radius:3px;margin-right:2px;align-self:flex-start}
.tp-q .tp-qt{flex:1}
.tag-editor{display:flex;flex-direction:column;gap:10px}
.tag-editor-group{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.tag-editor-label{font-size:12px;font-weight:700;color:var(--text-3);min-width:34px}
.tag-check{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;padding:5px 13px;border:1px solid var(--border-2);border-radius:3px;user-select:none;background:var(--surface);color:var(--text-2);transition:.18s;font-family:inherit}
.tag-check:hover{border-color:var(--text);color:var(--text)}
.tag-check.active{background:var(--text);border-color:var(--text);color:#fff;font-weight:600}
@media(max-width:880px){
  .speak-layout{flex-direction:column}
  .speak-nav{position:static;width:100%;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:10px}
  .speak-nav-title{display:none}
  .speak-nav-item{white-space:nowrap}
  .speak-nav [data-act="collapse-all"]{width:auto;flex-shrink:0;margin-bottom:0}
}

/* Vocabulary */
.vocab-item{display:flex;gap:14px;align-items:flex-start}
.vocab-word{font-weight:800;font-size:17px;color:var(--text)}
.vocab-phonetic{color:var(--primary);font-size:13px;font-style:italic;margin-left:8px;font-weight:600}
.vocab-trans{color:var(--text-2);font-size:14px;margin-top:3px}
.vocab-sentence{font-size:15px;font-style:italic;color:var(--text);line-height:1.65;font-weight:500}
.vocab-source{font-size:11px;color:var(--text-3);margin-top:5px}
.vocab-actions{display:flex;gap:4px;flex-shrink:0}

/* Data table */
.data-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);font-size:13px;table-layout:fixed}
.data-table thead th{position:sticky;top:68px;z-index:10;background:var(--surface-2);padding:8px 10px;text-align:left;font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr{transition:.15s}
.data-table tbody tr:hover{background:var(--surface-hover)}
.data-table .cell-word{font-weight:700;color:var(--text);font-size:14px}
.data-table .cell-trans{color:var(--text-2)}
.data-table .cell-sentence{color:var(--text);font-size:13px;line-height:1.6;max-width:340px}
.data-table .cell-source{color:var(--text-3);font-size:11px;white-space:nowrap}
.data-table .cell-actions{white-space:nowrap;text-align:right;width:70px}
.data-table .cell-actions button{padding:4px 6px;font-size:14px}
.data-table .tag-sm{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;background:var(--primary-light);color:var(--text)}
.data-table .cell-q .q-text{font-weight:600;color:var(--text);font-size:13px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.data-table .cell-q .q-ans{font-size:11px;color:var(--text-3);margin-top:3px;line-height:1.5}
.data-table .cell-analysis{color:var(--text-2);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.data-table .cell-editor{width:100%}
.wrong-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.err-filter-grid{display:flex;flex-wrap:wrap;gap:6px}
.cell-editor{display:block;width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 4px;font-size:13px;color:inherit;line-height:1.5;resize:none;transition:.1s;overflow:hidden;height:24px;white-space:pre-wrap;word-break:break-word}
.cell-editor:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px var(--primary-light)}
.cell-editor:empty:before{content:attr(data-placeholder);color:var(--text-3);font-weight:400}
.cell-editor mark{color:var(--rose);background:transparent;font-weight:inherit}
.cell-err-wrap{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:24px;position:relative;cursor:pointer;padding:2px 4px;border-radius:4px;border:1px dashed transparent;transition:.1s}
.cell-err-wrap:hover{border-color:var(--border-2);background:var(--surface-2)}
.cell-err-wrap .err-chip{padding:2px 8px;font-size:11px;border-width:1px;cursor:pointer}
.cell-err-wrap .err-chip-placeholder{color:var(--text-3);font-size:11px}
.cell-err-popup{position:absolute;z-index:200;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:280px}
.cell-err-popup .err-chip{padding:4px 12px;font-size:12px;cursor:pointer}
.cell-err-picker{position:absolute;top:calc(100% + 4px);left:0;z-index:300;min-width:260px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:10px}
.cep-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px;display:flex;align-items:baseline;gap:6px}
.cep-sub{font-size:10px;color:var(--text-3);font-weight:400}
.cep-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cep-grid .cep-chip{cursor:pointer;padding:4px 12px;font-size:12px;user-select:none}
.cep-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--border);padding-top:6px}
.data-table tr.is-new{background:var(--primary-light)}
.data-table tr.is-new:hover{background:var(--primary-light)}

/* Writing */
.write-content{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.9;color:var(--text)}
.write-content-edit{width:100%;min-height:320px;font-size:14px;line-height:1.9;padding:14px;border:1.5px solid var(--border-2);border-radius:var(--radius-sm);background:var(--surface-2)}
.write-content-edit:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-light)}

/* Search input */
.search-input{width:100%;padding:10px 16px 10px 38px;border:1.5px solid var(--border-2);border-radius:var(--radius-sm);background:var(--surface-2);transition:.2s}
.search-input:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-light)}
.search-wrap{position:relative;margin-bottom:18px}
.search-wrap::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}

@media(max-width:680px){
  .header-inner{padding:0 16px;gap:14px}
  .logo-text{display:none}
  main#content{padding:24px 16px 100px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .ft-panel{width:calc(100vw - 32px);right:-4px}
  .modal{max-width:100%}
  .entry-actions{gap:4px}
}
</style>

  save(){
    try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }
    catch(e){ toast("存储空间不足，请导出数据后清理","error"); }
  },
  defaults(){
    return {
      listening:{ synonyms:[], wrongQuestions:[], wrongWords:[] },
      reading:{ synonyms:[], wrongQuestions:[] },
      speaking:{ part1:{topics:[]}, part23:{topics:[]} },
      writing:{ task1:[], task2:[] },
      vocabulary:{ words:[], sentences:[] },
    };
  },
  _merge(base, target){
    if(typeof base!=="object"||base===null||Array.isArray(base)) return target!==undefined?target:base;
    const out = {...base};
    for(const k in base){ out[k] = target&&target[k]!==undefined ? this._merge(base[k],target[k]) : base[k]; }
    return out;
  },
  _migrateV1(old){
    const d = this.defaults();
    if(old.listening){
      d.listening.synonyms = old.listening.synonyms||[];
      d.listening.wrongQuestions = (old.listening.wrongQuestions||[]).map(q=>({...q,errorType:""}));
    }
    if(old.reading){
      d.reading.synonyms = old.reading.synonyms||[];
      d.reading.wrongQuestions = (old.reading.wrongQuestions||[]).map(q=>({...q,errorType:""}));
    }
    if(old.speaking){
      // migrate flat arrays to topic structure
      if(old.speaking.part1&&old.speaking.part1.length){
        d.speaking.part1.topics = [{id:this.uid(),name:"导入的题目",questions:old.speaking.part1.map(q=>({...q,createdAt:q.createdAt||Date.now()}))}];
      }
      if((old.speaking.part2&&old.speaking.part2.length)||(old.speaking.part3&&old.speaking.part3.length)){
        d.speaking.part23.topics = [{
          id:this.uid(), name:"导入的话题",
          part2: old.speaking.part2[0]||{question:"",answer:"",audioId:"",note:""},
          part3: (old.speaking.part3||[]).map(q=>({...q})),
          createdAt: Date.now()
        }];
      }
    }
    if(old.writing&&old.writing.essays){
      old.writing.essays.forEach(e=>{
        const item = {id:this.uid(),title:e.title,content:e.content,note:e.note,createdAt:e.createdAt||Date.now()};
        if(e.type==="task1") d.writing.task1.push(item); else d.writing.task2.push(item);
      });
    }
    if(old.vocabulary){ d.vocabulary = old.vocabulary; }
    return d;
  },
  _migratePhrases(){
    const v=this.data.vocabulary; if(!v||!v.words) return;
    const toMove=[]; const keep=[];
    v.words.forEach(w=>{
      const wc=w.word.trim().split(/\s+/).length;
      if(wc>=4) toMove.push(w); else keep.push(w);
    });
    if(!toMove.length) return;
    v.words=keep;
    toMove.forEach(w=>{
      v.sentences.push({
        id:this.uid(), sentence:w.word, translation:w.translation||"",
        note:w.note||"", source:w.source||"", audioUrl:"", createdAt:w.createdAt||Date.now()
      });
    });
    this.save();
  },
  _fixDupIds(){
    const fixList=(arr)=>{
      if(!Array.isArray(arr)) return;
      const seen=new Set(); let fixed=0;
      arr.forEach(item=>{
        if(!item.id||seen.has(item.id)){ item.id=this.uid(); fixed++; }
        seen.add(item.id);
      });
      if(fixed>0){ console.log("[Store] Fixed "+fixed+" duplicate IDs"); this.save(); }
    };
    if(this.data.listening){ fixList(this.data.listening.wrongQuestions); fixList(this.data.listening.synonyms); }
    if(this.data.reading){ fixList(this.data.reading.wrongQuestions); fixList(this.data.reading.synonyms); }
    if(this.data.vocabulary){ fixList(this.data.vocabulary.words); fixList(this.data.vocabulary.sentences); }
  },
  uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
};

const AudioStore = {
  db:null,
  init(){
    return new Promise(resolve=>{
      try{
        const req = indexedDB.open("ielts_barbara_audio",1);
        req.onupgradeneeded = e=>{ e.target.result.createObjectStore("audio",{keyPath:"id"}); };
        req.onsuccess = e=>{ this.db=e.target.result; resolve(); };
        req.onerror = ()=>resolve();
      }catch(e){ resolve(); }
    });
  },
  save(id,blob){ return new Promise((resolve,reject)=>{ if(!this.db)return reject("no db"); const tx=this.db.transaction("audio","readwrite"); tx.objectStore("audio").put({id,blob}); tx.oncomplete=()=>resolve(id); tx.onerror=()=>reject(tx.error); }); },
  get(id){ return new Promise((resolve,reject)=>{ if(!this.db)return reject("no db"); const tx=this.db.transaction("audio","readonly"); const req=tx.objectStore("audio").get(id); req.onsuccess=()=>resolve(req.result?req.result.blob:null); req.onerror=()=>reject(req.error); }); },
  delete(id){ return new Promise(resolve=>{ if(!this.db)return resolve(); try{ const tx=this.db.transaction("audio","readwrite"); tx.objectStore("audio").delete(id); tx.oncomplete=()=>resolve(); tx.onerror=()=>resolve(); }catch(e){ resolve(); } }); }
};

/* ============================================================ TRANSLATOR */
const Translator = {
  async lookup(text){
    const t = text.trim(); if(!t) return null;
    const isWord = /^[a-zA-Z][a-zA-Z'-]*$/.test(t) && t.length<=35;
    let result = {text:t,translation:"",phonetic:"",definition:"",audioUrl:"",isWord};
    if(isWord){
      const lower = t.toLowerCase();
      if(DICT[lower]) result.translation = DICT[lower];
      const dr = await this._dictApi(lower).catch(()=>null);
      if(dr){ result.phonetic=dr.phonetic; result.audioUrl=dr.audioUrl; if(!result.translation&&dr.definition) result.translation="（在线释义）"+dr.definition; }
      if(!result.translation){ const on=await this._translateApi(t).catch(()=>null); if(on) result.translation=on; }
    } else {
      const on = await this._translateApi(t).catch(()=>null);
      if(on) result.translation = on;
    }
    return result;
  },
  _dictApi(word){
    return new Promise((resolve,reject)=>{
      fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).then(r=>r.json()).then(data=>{
        if(!Array.isArray(data)||!data[0]) return reject("nf");
        const e=data[0]; let phonetic=e.phonetic||"",audioUrl="";
        if(e.phonetics){ const wa=e.phonetics.find(p=>p.audio&&p.audio.length>0); if(wa) audioUrl=wa.audio.startsWith("//")?"https:"+wa.audio:wa.audio; if(!phonetic) phonetic=(e.phonetics.find(p=>p.text)||{}).text||""; }
        let def=""; if(e.meanings&&e.meanings[0]&&e.meanings[0].definitions&&e.meanings[0].definitions[0]) def=e.meanings[0].definitions[0].definition||"";
        resolve({phonetic,audioUrl,definition:def});
      }).catch(reject);
    });
  },
  _translateApi(text){
    const isZh=/[\u4e00-\u9fa5]/.test(text);
    const sl=isZh?"zh-CN":"en", tl=isZh?"en":"zh-CN";
    return fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`).then(r=>r.json()).then(d=>{ if(d&&d.responseData&&d.responseData.translatedText) return d.responseData.translatedText; throw new Error("nf"); }).catch(()=>{
      return fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`).then(r=>r.json()).then(d=>{ if(d&&d[0]&&d[0][0]&&d[0][0][0]) return d[0].map(x=>x[0]).join(""); throw new Error("nf"); });
    });
  },
  pronounce(text,opts={}){
    if(opts.audioUrl){ try{ new Audio(opts.audioUrl).play(); return; }catch(e){} }
    if("speechSynthesis" in window){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=opts.lang||"en-GB"; u.rate=opts.rate||0.9; speechSynthesis.speak(u); }
  }
};

/* ============================================================ UI HELPERS */
function toast(msg,type="info"){
  const c=document.getElementById("toast-container"); const el=document.createElement("div");
  el.className="toast "+type; el.textContent=msg; c.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition=".3s"; setTimeout(()=>el.remove(),300); },2600);
}
function showModal(title,bodyHTML,onSave,opts={}){
  const root=document.getElementById("modal-root"); const saveText=opts.saveText||"保存"; const wide=opts.wide?"max-width:680px":"";
  root.innerHTML=`<div class="modal-overlay"><div class="modal" style="${wide}"><div class="modal-header"><span class="modal-title">${title}</span><button class="modal-close" data-act="cancel">&times;</button></div><div class="modal-body">${bodyHTML}</div><div class="modal-footer"><button class="btn btn-outline" data-act="cancel">取消</button><button class="btn btn-primary" data-act="save">${saveText}</button></div></div></div>`;
  const ov=root.querySelector(".modal-overlay");
  ov.addEventListener("click",e=>{ if(e.target===ov||e.target.dataset.act==="cancel") hideModal(); if(e.target.dataset.act==="save") onSave(root.querySelector(".modal-body")); });
  setTimeout(()=>{ const inp=root.querySelector("input,textarea,select"); if(inp) inp.focus(); },50);
}
function hideModal(){ document.getElementById("modal-root").innerHTML=""; }
function confirmDialog(msg,onYes){ showModal("确认",`<p style="font-size:14px;line-height:1.7">${msg}</p>`,()=>{ hideModal(); onYes(); },{saveText:"确认"}); }
function fmtDate(ts){ if(!ts) return ""; const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function esc(s){ if(!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function initTabs(container){
  container.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click",()=>{
      const target=tab.dataset.tab;
      container.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); tab.classList.add("active");
      container.querySelectorAll(".tab-panel").forEach(p=>p.classList.add("hidden"));
      const panel=container.querySelector(`[data-panel="${target}"]`); if(panel) panel.classList.remove("hidden");
    });
  });
}

/* ============================================================ SELECTION POPUP */
const SelectionPopup = {
  popup:null,
  init(){
    this.popup=document.getElementById("translate-popup");
    let mdi=false;
    this.popup.addEventListener("mousedown",()=>{ mdi=true; });
    document.addEventListener("mouseup",e=>{
      if(mdi){ mdi=false; return; }
      if(this.popup.contains(e.target)) return;
      const sel=window.getSelection(); const text=sel.toString().trim();
      if(text&&text.length>0&&text.length<500){
        const range=sel.getRangeAt(0); const content=document.getElementById("content");
        if(content.contains(range.commonAncestorContainer)||range.commonAncestorContainer===content) this.show(e.clientX,e.clientY,text);
      }
    });
    document.addEventListener("mousedown",e=>{ if(mdi) return; if(!this.popup.contains(e.target)) this.hide(); });
  },
  async show(x,y,text){
    this.popup.innerHTML='<div class="popup-loading">查询中…</div>'; this._position(x,y); this.popup.classList.remove("hidden");
    const r=await Translator.lookup(text); if(!r){ this.hide(); return; } this._render(r); this._position(x,y);
  },
  _render(r){
    let h=`<div class="popup-header"><span class="popup-word">${esc(r.text)}</span>`;
    if(r.phonetic) h+=`<span class="popup-phonetic">/${esc(r.phonetic)}/</span>`;
    h+=`<button class="btn-icon" data-act="speak" title="发音">🔊</button></div><div class="popup-body">`;
    if(r.translation) h+=`<div class="popup-trans">${esc(r.translation)}</div>`;
    if(r.definition) h+=`<div class="popup-def">${esc(r.definition)}</div>`;
    if(!r.translation&&!r.definition) h+=`<div class="popup-def">暂无结果（可能网络不可用）</div>`;
    h+=`</div><div class="popup-footer"><button class="btn btn-outline btn-sm" data-act="collect">${r.isWord?"⭐ 收藏生词":"⭐ 收藏句子"}</button><button class="btn btn-outline btn-sm" data-act="note">📝 备注</button></div>`;
    this.popup.innerHTML=h;
    this.popup.querySelector('[data-act="speak"]').addEventListener("click",()=>Translator.pronounce(r.text,{audioUrl:r.audioUrl}));
    this.popup.querySelector('[data-act="collect"]').addEventListener("click",()=>this._collect(r));
    this.popup.querySelector('[data-act="note"]').addEventListener("click",()=>this._addNote(r));
  },
  _collect(r){
    if(r.isWord){
      if(Store.data.vocabulary.words.find(w=>w.word.toLowerCase()===r.text.toLowerCase())){ toast("该生词已在收藏库中","info"); return; }
      Store.data.vocabulary.words.push({id:Store.uid(),word:r.text,translation:r.translation,phonetic:r.phonetic||"",note:"",source:"划词",audioUrl:r.audioUrl||"",createdAt:Date.now()});
      Store.save(); toast("已收藏到生词本","success");
    } else {
      Store.data.vocabulary.sentences.push({id:Store.uid(),sentence:r.text,translation:r.translation,note:"",source:"划词",createdAt:Date.now()});
      Store.save(); toast("已收藏到高频句子","success");
    }
  },
  _addNote(r){
    let item = r.isWord ? Store.data.vocabulary.words.find(w=>w.word.toLowerCase()===r.text.toLowerCase()) : Store.data.vocabulary.sentences.find(s=>s.sentence===r.text);
    if(!item){ this._collect(r); item = r.isWord ? Store.data.vocabulary.words.find(w=>w.word.toLowerCase()===r.text.toLowerCase()) : Store.data.vocabulary.sentences.find(s=>s.sentence===r.text); }
    const oldNote = item?item.note:"";
    showModal("添加备注",`<div class="field"><label>${r.isWord?"生词":"句子"}：${esc(r.text)}</label><textarea id="note-input" rows="3" placeholder="输入备注内容…">${esc(oldNote)}</textarea></div>`,body=>{
      const v=body.querySelector("#note-input").value.trim(); if(item){ item.note=v; Store.save(); }
      toast("备注已保存","success"); hideModal();
    });
  },
  _position(x,y){
    this.popup.style.visibility="hidden"; this.popup.classList.remove("hidden");
    const rect=this.popup.getBoundingClientRect(); const vw=window.innerWidth,vh=window.innerHeight;
    let left=x+12,top=y+12;
    if(left+rect.width>vw-10) left=x-rect.width-12;
    if(top+rect.height>vh-10) top=y-rect.height-12;
    if(left<10) left=10; if(top<10) top=10;
    this.popup.style.left=left+"px"; this.popup.style.top=top+"px"; this.popup.style.visibility="visible";
  },
  hide(){ this.popup.classList.add("hidden"); }
};

/* ============================================================ FAVORITES */
function collectWord(word,translation,phonetic,source){
  word=word.trim(); if(!word) return;
  if(Store.data.vocabulary.words.find(w=>w.word.toLowerCase()===word.toLowerCase())){ toast("该生词已收藏","info"); return; }
  Store.data.vocabulary.words.push({id:Store.uid(),word,translation:translation||"",phonetic:phonetic||"",note:"",source:source||"",audioUrl:"",createdAt:Date.now()});
  Store.save(); toast("已收藏到生词本","success");
}
function collectSentence(sentence,translation,source){
  sentence=sentence.trim(); if(!sentence) return;
  if(Store.data.vocabulary.sentences.find(s=>s.sentence===sentence)){ toast("该句子已收藏","info"); return; }
  Store.data.vocabulary.sentences.push({id:Store.uid(),sentence,translation:translation||"",note:"",source:source||"",createdAt:Date.now()});
  Store.save(); toast("已收藏到高频句子","success");
}

/* ============================================================ LISTENING & READING */
function createPracticeModule(key,label,errorTypes){
  return {
    _key:key,_label:label,_errors:errorTypes,_wrongFilter:"",
    render(){
      const m=Store.data[key];
      const isL=key==="listening";
      const wordTab=isL?`<button class="tab" data-tab="words">错词 (${m.wrongWords.length})</button>`:"";
      return `<h1 class="page-title">${label}练习</h1>
        <div class="tabs"><button class="tab active" data-tab="syn">同义替换 (${m.synonyms.length})</button><button class="tab" data-tab="wrong">错题记录 (${m.wrongQuestions.length})</button>${wordTab}</div>
        <div class="tab-panel" data-panel="syn">${this._renderSyn(m.synonyms)}</div>
        <div class="tab-panel hidden" data-panel="wrong"><div class="wrong-toolbar"><div class="err-filter-grid">${this._renderFilterChips()}</div><button class="btn btn-outline btn-sm" data-act="batch-import-wrong" style="margin-left:auto">批量导入</button></div>${this._renderWrong(m.wrongQuestions)}</div>${isL?`<div class="tab-panel hidden" data-panel="words">${this._renderWrongWords()}</div>`:""}`;
    },
    _renderFilterChips(){
      const all=Store.data[key].wrongQuestions.length;
      const counts={};
      Store.data[key].wrongQuestions.forEach(q=>{ (q.errorType?q.errorType.split(","):[]).forEach(t=>{ if(t) counts[t]=(counts[t]||0)+1; }); });
      const chip=(txt,val,cl)=>{
        const active=this._wrongFilter===val;
        const style=active?`background:${cl};color:#fff;border-color:transparent`:"";
        return `<span class="err-chip ${active?"active":""}" data-filter="${val}" style="${style}">${txt}</span>`;
      };
      return chip(`全部 (${all})`,"","var(--primary)")+errorTypes.filter(t=>counts[t]).map(t=>chip(`${t} (${counts[t]})`,t,ERR_COLORS[t].c)).join("");
    },
    mount(root){
      initTabs(root);
      const self=this;
      this._root=root;
      const errPickerEl=()=>{
        const t=document.createElement("div");
        t.id="cell-err-picker";
        t.className="cell-err-picker";
        t.innerHTML=`<div class="cep-title">选择错误类型<span class="cep-sub">（最多2个）</span></div><div class="cep-grid">${errorTypes.map(et=>`<span class="err-chip cep-chip" data-cep="${et}">${et}</span>`).join("")}</div><div class="cep-foot"><button class="btn btn-link cep-clear">清空</button><button class="btn btn-sm btn-primary cep-done">完成</button></div>`;
        return t;
      };
      const closePicker=()=>{
        const p=document.getElementById("cell-err-picker");
        if(!p) return;
        const row=p._row;
        const wrap=p.parentElement;
        const cur=[];
        p.querySelectorAll(".cep-chip.active").forEach(c=>cur.push(c.dataset.cep));
        const joined=cur.join(",");
        const id=row?row.dataset.wrongRow:null;
        p.remove();
        if(!row||id===null) return;
        if(id==="NEW"){
          const proto=self._getProtoRow();
          proto.errorType=joined;
          self._setProtoRow(proto);
        } else {
          self._saveWrongRow(id,"errorType",joined);
        }
        if(wrap){
          wrap.innerHTML=self._errBadgesFor(joined);
        }
      };
      this._clickHandler=function(e){
        const bi=e.target.closest('[data-act="batch-import-wrong"]');
        if(bi){ self._batchImportWrong(); return; }
        const iw=e.target.closest('[data-act="import-words"]');
        if(iw){ self._importWrongWords(); return; }
        const wsort=e.target.closest("[data-wsort]");
        if(wsort){ self._wordSort=wsort.dataset.wsort; self._rerenderWrongWords(); return; }
        const addBtn=e.target.closest("[data-add]");
        if(addBtn){
          // add wrong: focus the NEW row at bottom
          const newRow=root.querySelector('tr[data-wrong-row="NEW"]');
          if(newRow){ const f=newRow.querySelector(".cell-editor"); if(f){ f.focus(); self._autoHeight(f); } }
          else { window.__protoWrongRow=null; self._rerenderWrong("NEW","question"); }
          return;
        }
        const delSyn=e.target.closest("[data-del-syn]");
        if(delSyn){ return; }
        const delWrong=e.target.closest("[data-del-wrong]");
        if(delWrong){ return; }
        const saveNewSyn=e.target.closest('[data-act="save-new-syn"]');
        if(saveNewSyn){
          const proto=self._getProtoSynRow();
          const stripTags=s=>(s||"").replace(/<[^>]+>/g,"").trim();
          if(!stripTags(proto.word1)||!stripTags(proto.word2)){ toast("请填写两个词/短语","error"); return; }
          const list=Store.data[key].synonyms;
          const ns={id:Store.uid(),word1:proto.word1,word2:proto.word2,note:proto.note||"",createdAt:Date.now()};
          list.push(ns); Store.save();
          window.__protoSynRow=null;
          toast("已添加同义替换","success");
          self._rerenderSyn();
          return;
        }
        const insertBelowSyn=e.target.closest('[data-act="insert-below-syn"]');
        if(insertBelowSyn){ self._insertSynAfter(insertBelowSyn.dataset.insertAfter); return; }
        const saveNew=e.target.closest('[data-act="save-new"]');
        if(saveNew){
          const proto=self._getProtoRow();
          const stripTags=s=>(s||"").replace(/<[^>]+>/g,"").trim();
          const hasContent=stripTags(proto.question)||stripTags(proto.analysis)||proto.errorType||stripTags(proto.note);
          if(!hasContent){ toast("请至少填写一项内容","error"); return; }
          const list=Store.data[key].wrongQuestions;
          proto.id=Store.uid(); proto.createdAt=Date.now();
          list.push(proto);
          // Auto-extract synonym pairs from 改写 errors (Listening only)
          if(key==="listening"&&proto.errorType&&proto.errorType.split(",").includes("改写")&&proto.analysis){
            self._extractSynonyms(proto.analysis, proto.question);
          }
          Store.save();
          window.__protoWrongRow=null;
          toast("已添加新错题","success");
          self._rerenderWrong();
          return;
        }
        const insertBelow=e.target.closest('[data-act="insert-below"]');
        if(insertBelow){
          self._insertRowAfter(insertBelow.dataset.insertAfter);
          return;
        }
        // Error type picker
        const errWrap=e.target.closest(".cell-err-wrap");
        if(errWrap){
          e.stopPropagation();
          const row=errWrap.closest("tr[data-wrong-row]"); if(!row) return;
          const id=row.dataset.wrongRow;
          let curTypes=[];
          if(id==="NEW"){ const proto=self._getProtoRow(); curTypes=proto.errorType?proto.errorType.split(",").filter(Boolean):[]; }
          else { const q=Store.data[key].wrongQuestions.find(x=>x.id===id); if(q) curTypes=q.errorType?q.errorType.split(",").filter(Boolean):[]; }
          const existing=document.getElementById("cell-err-picker");
          if(existing) existing.remove();
          const picker=errPickerEl();
          picker._row=row;
          picker.querySelectorAll(".cep-chip").forEach(c=>{
            if(curTypes.includes(c.dataset.cep)){
              c.classList.add("active");
              const cl=ERR_COLORS[c.dataset.cep]; if(cl){ c.style.background=cl.c; c.style.color="#fff"; }
            }
          });
          errWrap.appendChild(picker);
          picker.querySelectorAll(".cep-chip").forEach(c=>{
            c.addEventListener("click",function(ev){
              ev.stopPropagation();
              const isActive=c.classList.contains("active");
              if(isActive){ c.classList.remove("active"); c.style.background=""; c.style.color=""; }
              else {
                const act=picker.querySelectorAll(".cep-chip.active").length;
                if(act>=2){ toast("最多选择 2 个错误类型","error"); return; }
                c.classList.add("active");
                const cl=ERR_COLORS[c.dataset.cep]; if(cl){ c.style.background=cl.c; c.style.color="#fff"; }
              }
            });
          });
          picker.querySelector(".cep-clear").addEventListener("click",function(ev){
            ev.stopPropagation();
            picker.querySelectorAll(".cep-chip.active").forEach(c=>{ c.classList.remove("active"); c.style.background=""; c.style.color=""; });
          });
          picker.querySelector(".cep-done").addEventListener("click",function(ev){ ev.stopPropagation(); closePicker(); });
          return;
        }
        const filter=e.target.closest("[data-filter]");
        if(filter){ self._wrongFilter=filter.dataset.filter; self._rerenderWrong(); return; }
        const speak=e.target.closest("[data-speak]");
        if(speak){ Translator.pronounce(speak.dataset.speak); return; }
        const collectW=e.target.closest("[data-collect-w]");
        if(collectW){ collectWord(collectW.dataset.collectW,collectW.dataset.trans||"","",label); return; }
      };
      root.addEventListener("click",this._clickHandler);
      this._dblclickHandler=function(e){
        const delSyn=e.target.closest("[data-del-syn]");
        if(delSyn){ self._delSyn(delSyn.dataset.delSyn); return; }
        const delWrong=e.target.closest("[data-del-wrong]");
        if(delWrong){ self._delWrong(delWrong.dataset.delWrong); return; }
        const wwd=e.target.closest("[data-ww-del]");
        if(wwd){ self._delWrongWord(wwd.dataset.wwDel); return; }
      };
      root.addEventListener("dblclick",this._dblclickHandler);
      // Close picker on outside click
      this._docClickHandler=function(e){
        const p=document.getElementById("cell-err-picker");
        if(!p) return;
        if(p.contains(e.target)) return;
        if(e.target.closest(".cell-err-wrap")===p.parentElement) return;
        closePicker();
      };
      document.addEventListener("click",this._docClickHandler);
      // Blur: save data WITHOUT rebuilding DOM
      this._blurHandler=function(e){
        const ta=e.target;
        if(!ta.classList||!ta.classList.contains("cell-editor")) return;
        const value=ta.innerHTML;
        const field=ta.dataset.field;
        // Synonym rows
        const synRow=ta.closest("tr[data-syn-row]");
        if(synRow){
          const sid=synRow.dataset.synRow;
          self._saveSynRow(sid, field, value);
          self._autoHeight(ta);
          return;
        }
        // Wrong question rows
        const row=ta.closest("tr[data-wrong-row]");
        if(!row) return;
        const rowId=row.dataset.wrongRow;
        if(rowId==="NEW"){
          const proto=self._getProtoRow();
          if(field==="question") proto.question=value;
          else if(field==="analysis") proto.analysis=value;
          else if(field==="note") proto.note=value;
          self._setProtoRow(proto);
        } else {
          self._saveWrongRow(rowId, field, value);
        }
        // Re-adjust height after blur (content may have changed via autofill etc)
        self._autoHeight(ta);
      };
      // Input: auto-resize textarea
      this._inputHandler=function(e){
        const ta=e.target;
        if(ta.classList&&ta.classList.contains("cell-editor")){
          self._autoHeight(ta);
        }
      };
      // Keydown: Enter to move next, Shift+Enter for newline, Cmd+B to toggle red highlight
      this._keydownHandler=function(e){
        const ta=e.target;
        // Wrong word spelling input handling
        if(ta.classList&&ta.classList.contains("ww-input")){
          if(e.key==="Tab"){
            e.preventDefault();
            self._speakWord(ta.dataset.word);
            return;
          }
          if(e.key==="Enter"){
            e.preventDefault();
            const word=ta.dataset.word;
            const wEl=ta.closest("tr").querySelector(".ww-word");
            const isWrong=ta.dataset.wrong==="1";
            const isCorrect=ta.dataset.correct==="1";
            if(isWrong){
              // Wrong -> retry: reset and re-spell same word
              ta.dataset.wrong="0";
              ta.value="";
              ta.style.color="";
              ta.style.borderColor="";
              if(wEl) wEl.style.opacity="0";
              return;
            }
            if(isCorrect){
              // Correct -> jump to next word and clear input
              ta.dataset.correct="0";
              ta.value="";
              ta.style.color="";
              ta.style.borderColor="";
              if(wEl) wEl.style.opacity="0";
              self._wwMoveNext(ta);
              return;
            }
            const val=ta.value.trim();
            // Show word
            if(wEl) wEl.style.opacity="1";
            if(val.toLowerCase()===word.toLowerCase()){
              // Correct
              ta.dataset.correct="1";
              ta.style.color="var(--emerald)";
              ta.style.borderColor="var(--emerald)";
              const w=Store.data.listening.wrongWords.find(x=>x.id===ta.dataset.wwid);
              if(w){ w.correctCount=(w.correctCount||0)+1; Store.save(); }
              const cEl=ta.closest("tr").querySelector(".ww-count");
              if(cEl) cEl.textContent=w?w.correctCount:1;
            } else {
              // Wrong
              ta.dataset.wrong="1";
              ta.style.color="var(--rose)";
              ta.style.borderColor="var(--rose)";
            }
            return;
          }
          return;
        }
        if(!ta.classList||!ta.classList.contains("cell-editor")) return;
        if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="b"){
          e.preventDefault();
          const sel=window.getSelection();
          if(sel&&sel.rangeCount>0&&!sel.isCollapsed){
            const range=sel.getRangeAt(0);
            // Check if selection is entirely within a <mark>
            let node=range.commonAncestorContainer;
            const inMark=node.nodeType===3?(node.parentNode&&node.parentNode.tagName==="MARK"):(node.tagName==="MARK");
            if(inMark){
              // Unwrap: replace mark with its children
              const markEl=node.nodeType===3?node.parentNode:node;
              const parent=markEl.parentNode;
              while(markEl.firstChild) parent.insertBefore(markEl.firstChild,markEl);
              parent.removeChild(markEl);
            } else {
              const mark=document.createElement("mark");
              try{ range.surroundContents(mark); }catch(err){
                mark.appendChild(range.extractContents()); range.insertNode(mark);
              }
            }
            sel.removeAllRanges(); ta.focus(); self._autoHeight(ta);
          }
          return;
        }
        if(e.key==="Enter"&&!e.shiftKey){
          e.preventDefault();
          ta.blur();
          // Find next editable element
          const all=Array.from(root.querySelectorAll("tr[data-wrong-row] .cell-editor, tr[data-syn-row] .cell-editor"));
          const idx=all.indexOf(ta);
          if(idx>=0&&idx<all.length-1){
            const nx=all[idx+1];
            nx.focus();
            self._autoHeight(nx);
          }
          return;
        }
      };
      root.addEventListener("blur",this._blurHandler,true);
      root.addEventListener("input",this._inputHandler);
      root.addEventListener("keydown",this._keydownHandler,true);
      // Initialize textarea heights for existing content
      root.querySelectorAll(".cell-editor").forEach(el=>self._autoHeight(el));

    unmount(){
      if(this._root&&this._clickHandler){ this._root.removeEventListener("click",this._clickHandler); }
      if(this._root&&this._dblclickHandler){ this._root.removeEventListener("dblclick",this._dblclickHandler); }
      if(this._root&&this._blurHandler){ this._root.removeEventListener("blur",this._blurHandler,true); }
      if(this._root&&this._inputHandler){ this._root.removeEventListener("input",this._inputHandler); }
      if(this._root&&this._keydownHandler){ this._root.removeEventListener("keydown",this._keydownHandler,true); }
      if(this._docClickHandler){ document.removeEventListener("click",this._docClickHandler); }
      const p=document.getElementById("cell-err-picker"); if(p) p.remove();
      this._root=null; this._clickHandler=null; this._dblclickHandler=null; this._blurHandler=null; this._inputHandler=null; this._keydownHandler=null; this._docClickHandler=null;
    },
    _renderSyn(list){
      const renderContent=s=>{ if(!s) return ""; const str=String(s); return /<[a-z][^>]*>/i.test(str)&&/&lt;|&gt;|&amp;/.test(str)===false ? str : esc(str).replace(/\n/g,"<br>"); };
      const renderRow=(s,isNew)=>{
        const sid=isNew?'NEW':s.id;
        return `<tr data-syn-row="${sid}"${isNew?' class="is-new"':''}>
          <td class="cell-word"><div class="cell-editor" contenteditable="true" data-field="word1" data-syn="${sid}">${renderContent(s.word1)}</div></td>
          <td style="text-align:center;color:var(--primary);font-weight:700">⇄</td>
          <td class="cell-word"><div class="cell-editor" contenteditable="true" data-field="word2" data-syn="${sid}">${renderContent(s.word2)}</div></td>
          <td class="cell-trans"><div class="cell-editor" contenteditable="true" data-field="note" data-syn="${sid}">${renderContent(s.note||"")}</div></td>
          <td class="cell-actions">
            ${isNew?'<button class="btn-icon" title="保存新行" data-act="save-new-syn">💾</button>':`<button class="btn-icon" title="在下方插入一行" data-act="insert-below-syn" data-insert-after="${s.id}">➕</button>`}
            <button class="btn-icon" data-speak="${esc(s.word1)}" title="发音">🔊</button>
            <button class="btn-icon" data-speak="${esc(s.word2)}" title="发音">🔊</button>
            <button class="btn-icon" data-del-syn="${sid}" title="双击删除">🗑️</button>
          </td>
        </tr>`;
      };
      const newProto=this._getProtoSynRow();
      return `<table class="data-table"><thead><tr><th>词/短语 1</th><th></th><th>词/短语 2</th><th>备注</th><th style="text-align:right">操作</th></tr></thead><tbody>`+
        list.map(s=>renderRow(s,false)).join("")+renderRow(newProto,true)+`</tbody></table>`;
    },
    _rerenderSyn(preserveId, preserveField){
      const panel=document.querySelector('[data-panel="syn"]');
      if(!panel) return;
      const sy=window.scrollY;
      panel.innerHTML=this._renderSyn(Store.data[key].synonyms);
      window.scrollTo(0,sy);
      const self=this;
      panel.querySelectorAll(".cell-editor").forEach(el=>self._autoHeight(el));
      if(preserveId){
        const row=panel.querySelector(`[data-syn-row="${preserveId}"]`);
        if(row&&preserveField){
          const el=row.querySelector(`[data-field="${preserveField}"]`);
          if(el){ el.focus(); self._autoHeight(el); }
        }
      }
    },
    _getProtoSynRow(){
      const p=window.__protoSynRow=window.__protoSynRow||{word1:"",word2:"",note:""};
      return p;
    },
    _setProtoSynRow(q){ window.__protoSynRow=q; },
    _saveSynRow(id, field, value){
      const list=Store.data[key].synonyms;
      if(id==="NEW"){ const p=this._getProtoSynRow(); p[field]=value; this._setProtoSynRow(p); return; }
      const s=list.find(x=>x.id===id); if(!s) return;
      s[field]=value; Store.save();
    },
    _insertSynAfter(afterId){
      const list=Store.data[key].synonyms;
      const ns={id:Store.uid(),word1:"",word2:"",note:"",createdAt:Date.now()};
      if(afterId){ const idx=list.findIndex(s=>s.id===afterId); if(idx>=0) list.splice(idx+1,0,ns); else list.push(ns); }
      else list.push(ns);
      Store.save(); this._rerenderSyn(ns.id,"word1");
    },
    _delSyn(id){
      if(id==="NEW"){ window.__protoSynRow=null; this._rerenderSyn(); return; }
      const l=Store.data[key].synonyms; const i=l.findIndex(s=>s.id===id); if(i>=0){ l.splice(i,1); Store.save(); this._rerenderSyn(); }
    },
    _errBadgesFor(et){
      const ts=et?et.split(",").filter(Boolean):[];
      if(!ts.length) return '<span class="err-chip-placeholder">点击选择</span>';
      return ts.map(t=>{ const cl=ERR_COLORS[t]; return cl?`<span class="err-chip active" style="background:${cl.c};color:#fff;border-color:transparent">${t}</span>`:`<span class="err-chip active">${t}</span>`; }).join("");
    },
    _renderWrong(list){
      const filtered=this._wrongFilter?list.filter(q=>(q.errorType?q.errorType.split(","):[]).includes(this._wrongFilter)):list;
      const isL=key==="listening";
      const renderRow=(q,isNew)=>{
        const qStyle = isL
          ? 'style="font-weight:400"'
          : (q.question ? 'style="font-weight:600"' : '');
        const aStyle = 'style="font-weight:600"';
        const noteStyle = (!isL&&q&&q.note) ? 'style="font-weight:600"' : '';
        let rowBody="";
        const renderContent=s=>{ if(!s) return ""; const str=String(s); return /<[a-z][^>]*>/i.test(str)&&/&lt;|&gt;|&amp;/.test(str)===false ? str : esc(str).replace(/\n/g,"<br>"); };
        if(isL){
          rowBody = `
            <td class="cell-q">
              <div class="cell-editor" contenteditable="true" data-field="question" data-placeholder="例：C5-T2-S1 Q1" ${qStyle}>${renderContent(q.question)}</div>
            </td>
            <td>
              <div class="cell-err-wrap" data-field="errorType">${this._errBadgesFor(q.errorType)}</div>

            <td>
              <div class="cell-editor" contenteditable="true" data-field="analysis" ${aStyle}>${renderContent(q.analysis||'')}</div>
            </td>`;

          rowBody = `
            <td>
              <div class="cell-err-wrap" data-field="errorType">${this._errBadgesFor(q.errorType)}</div>
            </td>
            <td class="cell-q">
              <div class="cell-editor" contenteditable="true" data-field="question" ${qStyle}>${renderContent(q.question)}</div>
            </td>
            <td>
              <div class="cell-editor" contenteditable="true" data-field="analysis" ${aStyle}>${renderContent(q.analysis||'')}</div>
            </td>
            <td>
              <div class="cell-editor" contenteditable="true" data-field="note" ${noteStyle}>${renderContent(q.note||'')}</div>
            </td>`;
        }
        return `<tr data-wrong-row="${isNew?'NEW':q.id}"${isNew?' class="is-new"':''}>${rowBody}
          <td class="cell-actions">
            ${isNew?'<button class="btn-icon" title="保存新行" data-act="save-new">💾</button>':`<button class="btn-icon" title="在下方插入一行" data-act="insert-below" data-insert-after="${q.id}">➕</button>`}
            <button class="btn-icon" data-del-wrong="${isNew?'NEW':q.id}" title="删除">🗑️</button>
          </td>
        </tr>`;
      };
      const newProto = this._getProtoRow();
      const thead = isL
        ? '<table class="data-table"><thead><tr><th style="width:15%">卷子</th><th style="width:18%">类型</th><th>具体总结</th><th style="width:70px;text-align:right">操作</th></tr></thead><tbody>'
        : '<table class="data-table"><thead><tr><th style="width:16%">类型</th><th style="width:27%">原文</th><th style="width:27%">题目</th><th>备注</th><th style="width:70px;text-align:right">操作</th></tr></thead><tbody>';
      return thead
        + filtered.map(q=>renderRow(q,false)).join("")
        + renderRow(newProto, true)
        + '</tbody></table>';
    },
    _rerenderWrong(preserveId, preserveField){
      const panel=document.querySelector('[data-panel="wrong"]');
      if(!panel) return;
      const sy=window.scrollY;
      panel.innerHTML=`<div class="wrong-toolbar"><div class="err-filter-grid">${this._renderFilterChips()}</div><button class="btn btn-outline btn-sm" data-act="batch-import-wrong" style="margin-left:auto">批量导入</button></div>${this._renderWrong(Store.data[key].wrongQuestions)}`;
      window.scrollTo(0,sy);
      const self=this;
      panel.querySelectorAll(".cell-editor").forEach(el=>self._autoHeight(el));
      if(preserveId){
        const row=panel.querySelector(`[data-wrong-row="${preserveId}"]`);
        if(row&&preserveField){
          const el=row.querySelector(`[data-field="${preserveField}"]`);
          if(el){ el.focus(); self._autoHeight(el); }
        }
      }

    _autoHeight(el){
      el.style.height='auto';
      el.style.height=Math.max(24,el.scrollHeight)+'px';
    },
    _saveWrongRow(id, field, rawValue){
      const list=Store.data[key].wrongQuestions;
      let q, idx=-1, isNew=false;
      if(id==="NEW"){
        isNew=true;
        q=this._getProtoRow();
      } else {
        idx=list.findIndex(x=>x.id===id);
        if(idx<0) return null;
        q=list[idx];
      }
      if(field==="errorType"){ q.errorType = rawValue||""; }
      else if(field==="question"){ q.question=rawValue; }
      else if(field==="analysis"){ q.analysis=rawValue; }
      else if(field==="note"){ q.note=rawValue; }
      if(isNew){
        this._setProtoRow(q);
        return {savedAsNew:false, wasEmpty:true};
      }
      // Auto-extract synonym pairs from 改写 errors (Listening only)
      if(key==="listening"&&q.errorType&&q.errorType.split(",").includes("改写")&&q.analysis){
        this._extractSynonyms(q.analysis, q.question);
      }
      // Auto-extract wrong words from 拼写 errors (Listening only)
      if(key==="listening"&&q.errorType&&q.errorType.split(",").includes("拼写")&&q.analysis){
        this._extractWrongWords(q.analysis);
      }
      Store.save();
      return {savedAsNew:false, wasEmpty:false};
    },
    _extractSynonyms(html, source){
      // Strip HTML tags to get plain text
      const text=String(html).replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
      const srcText=source?String(source).replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim():"";
      // Match patterns like "word1 = word2 translation" where word1/word2 are English
      const re=/([A-Za-z][A-Za-z'\-]+(?:\s+[A-Za-z][A-Za-z'\-]+){0,2})\s*=\s*([A-Za-z][A-Za-z'\-]+(?:\s+[A-Za-z][A-Za-z'\-]+){0,2})/g;
      const syns=Store.data[key].synonyms;
      let added=0;
      let m;
      while((m=re.exec(text))!==null){
        const w1=m[1].trim(), w2=m[2].trim();
        // Avoid duplicates (either direction)
        const dup=syns.find(s=>(s.word1.toLowerCase()===w1.toLowerCase()&&s.word2.toLowerCase()===w2.toLowerCase())||(s.word1.toLowerCase()===w2.toLowerCase()&&s.word2.toLowerCase()===w1.toLowerCase()));
        if(!dup){ syns.push({id:Store.uid(),word1:w1,word2:w2,note:srcText||"自动提取",createdAt:Date.now()}); added++; }
      }
      if(added>0) toast(`已自动提取 ${added} 组同义替换`,"success");
    },
    _extractWrongWords(html){
      const text=String(html).replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
      // Extract the first English word before Chinese chars or parenthesis (e.g. "travel（写错trouble）" → "travel")
      const m=text.match(/^([A-Za-z][A-Za-z'\-]*(?:\s+[A-Za-z][A-Za-z'\-]*){0,2})/);
      if(!m) return;
      const word=m[1].trim();
      if(word.length<2) return;
      const list=Store.data.listening.wrongWords;
      if(list.find(w=>w.word.toLowerCase()===word.toLowerCase())) return;

      showModal("批量导入错题",`
        <div class="field"><label>粘贴错题内容（从飞书表格复制，Tab 分隔）</label><textarea id="f-batch" rows="14" style="font-size:13px;line-height:1.7;font-family:monospace" placeholder="${esc(placeholder)}"></textarea></div>
        <div style="font-size:12px;color:var(--text-3);line-height:1.8;padding:10px 14px;background:var(--surface-2);border-radius:8px">${formatDesc.replace("${ET}",errTypes.join(" / "))}</div>
      `,body=>{

        if(!raw){ toast("请粘贴内容","error"); return; }
        const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
        if(!lines.length){ toast("未解析到内容","error"); return; }
        const list=Store.data[key].wrongQuestions;
        let added=0, skipped=0;
        // 解析错题类型：支持单选或多选（用 / 、 + ， 等分隔，最多2个）
        const parseErrTypes=(raw)=>{
          if(!raw) return null;
          const tokens=raw.split(/[/、+，,]/).map(t=>t.trim()).filter(Boolean);
          const valid=tokens.filter(t=>errTypes.includes(t));
          if(!valid.length) return null;
          return valid.slice(0,2).join(",");
        };
        lines.forEach(line=>{
          const parts=line.split(/\t/).map(p=>p.trim());
          if(parts.length<4){ skipped++; return; }
          if(isL){
            const [paper,qNum,errTypeRaw,analysis]=parts;
            const errType=parseErrTypes(errTypeRaw);
            if(!errType){ skipped++; return; }
            const question=paper&&qNum?`${paper} Q${qNum}`:paper||"";
            list.push({id:Store.uid(),question,errorType:errType,analysis:analysis||"",note:"",createdAt:Date.now()});
            if(errType.split(",").includes("改写")&&analysis){ this._extractSynonyms(analysis, question); }
            if(errType.split(",").includes("拼写")&&analysis){ this._extractWrongWords(analysis); }
          } else {
            const [errTypeRaw,question,analysis,note]=parts;
            const errType=parseErrTypes(errTypeRaw);
            if(!errType){ skipped++; return; }
            list.push({id:Store.uid(),question:question||"",errorType:errType,analysis:analysis||"",note:note||"",createdAt:Date.now()});
            // 同义词 → 自动加入同义替换
            if(errType.split(",").includes("同义词")&&question&&analysis){
              const syns=Store.data[key].synonyms;
              const dup=syns.find(s=>(s.word1.toLowerCase()===question.toLowerCase()&&s.word2.toLowerCase()===analysis.toLowerCase())||(s.word1.toLowerCase()===analysis.toLowerCase()&&s.word2.toLowerCase()===question.toLowerCase()));
              if(!dup){ syns.push({id:Store.uid(),word1:question,word2:analysis,note:note||"自动提取",createdAt:Date.now()}); }
            }
          }
          added++;
        });
        Store.save(); hideModal();
        toast(`已导入 ${added} 条错题${skipped?`（跳过 ${skipped} 条格式不符）`:""}`,"success");
        this._rerenderWrong();
      },{wide:true});
    },
  };

/* WAV 编码：把 Web Audio 捕获的 Float32 PCM 转成 16bit PCM WAV，全平台可播放（含 iOS Safari） */
function encodeWAV(samples,sampleRate,targetRate){
  let len=0; for(const s of samples) len+=s.length;
  let data=new Float32Array(len); let off=0;
  for(const s of samples){ data.set(s,off); off+=s.length; }
  // 降采样到目标采样率（语音用 16kHz 足够，体积约降 2/3），线性插值
  if(targetRate&&targetRate!==sampleRate){
    const ratio=sampleRate/targetRate, n=Math.max(1,Math.round(len/ratio)), out=new Float32Array(n);
    for(let i=0;i<n;i++){ const p=i*ratio, i0=Math.floor(p), i1=Math.min(i0+1,len-1), f=p-i0; out[i]=data[i0]*(1-f)+data[i1]*f; }
    data=out; sampleRate=targetRate; len=n;
  }
  const buffer=new ArrayBuffer(44+len*2), view=new DataView(buffer);
  const writeStr=(o,str)=>{ for(let i=0;i<str.length;i++) view.setUint8(o+i,str.charCodeAt(i)); };
  writeStr(0,"RIFF"); view.setUint32(4,36+len*2,true); writeStr(8,"WAVE");
  writeStr(12,"fmt "); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  writeStr(36,"data"); view.setUint32(40,len*2,true);
  let p=44;
  for(let i=0;i<len;i++){ let s=Math.max(-1,Math.min(1,data[i])); view.setInt16(p,s<0?s*0x8000:s*0x7FFF,true); p+=2; }
  return new Blob([view],{type:"audio/wav"});
}
// 音频 blob <-> dataURL（base64）互转，用于导出/导入携带音频
function blobToDataURL(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); }); }
function dataURLToBlob(dataURL){ const idx=dataURL.indexOf(","); const mime=(dataURL.slice(5,idx).match(/[^;]+/)||["audio/wav"])[0]; const bin=atob(dataURL.slice(idx+1)); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }

const SPEAK_TAG_GROUPS=[
  {name:"type",label:"题型",tags:["必考题","新题","保留题"]},
  {name:"cat",label:"分类",tags:["事物类","事件类","人物类","地点类"]},
];
const Speaking={
  _recording:false,_recStream:null,_recordCtx:{tid:null,qid:null},
  _filters:{type:"",cat:""},
  _collapsed:new Set(),
  _activeTab:"p1",
  _scrollSpy:null,
  _dragId:null,_dragPart:null,
  _initState(){
    if(!this._filters||this._filters.type instanceof Set) this._filters={type:"",cat:""};
    if(typeof this._filters.type!=="string") this._filters.type="";
    if(typeof this._filters.cat!=="string") this._filters.cat="";
    if(!this._collapsed) this._collapsed=new Set();
    if(!this._activeTab) this._activeTab="p1";
  },
  _normalizeTopics(s){
    let changed=false;
    [...s.part1.topics,...s.part23.topics].forEach(t=>{
      if(!Array.isArray(t.tags)){ t.tags=[]; changed=true; }
      if(t._cat&&!t.tags.includes(t._cat)){ t.tags.push(t._cat); changed=true; }
      // 单选约束：每组最多保留一个标签
      for(const g of SPEAK_TAG_GROUPS){
        const inG=t.tags.filter(tg=>g.tags.includes(tg));
        if(inG.length>1){ t.tags=t.tags.filter(tg=>tg!==inG[0]); changed=true; }
      }
    });
    if(changed) Store.save();
  },
  _topicMatchesFilters(t){
    const tags=t.tags||[];
    for(const g of SPEAK_TAG_GROUPS){
      const sel=this._filters[g.name];
      if(!sel) continue;
      if(!tags.includes(sel)) return false;
    }
    return true;
  },
  render(){
    const s=Store.data.speaking;
    this._normalizeTopics(s);
    return `<h1 class="page-title">口语练习</h1>
      <div class="tabs">
        <button class="tab ${this._activeTab==="p1"?"active":""}" data-tab="p1">Part 1 (${s.part1.topics.reduce((a,t)=>a+t.questions.length,0)})</button>
        <button class="tab ${this._activeTab==="p23"?"active":""}" data-tab="p23">Part 2 & 3 (${s.part23.topics.length})</button>
      </div>
      <div class="speak-layout">${this._renderLayoutInner()}</div>`;

  _bindFilters(root){
    root.querySelectorAll("[data-filter-tag]").forEach(c=>{
      c.addEventListener("click",()=>{
        const g=c.dataset.filterGroup,tag=c.dataset.filterTag;
        this._filters[g]=(this._filters[g]===tag)?"":tag;
        this._rerender(root);
      });
    });
